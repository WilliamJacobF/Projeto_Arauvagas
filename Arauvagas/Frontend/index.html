<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Arauvagas - Encontre seu emprego</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand fw-bold" href="#"> Arauvagas </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbar"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbar">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link active" href="#">Buscar vagas</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="#cadastro">Cadastrar vaga</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container my-5">
      <section class="text-center mb-5">
        <h1 class="fw-bold">Encontre sua próxima oportunidade!</h1>

        <p class="text-muted">Busque vagas de emprego em Araucária e região.</p>
      </section>

      <!-- Busca -->
      <section class="mb-5">
        <h3 class="mb-3">Buscar vagas</h3>

        <form id="formBusca" class="d-flex gap-2">
          <input
            type="text"
            id="tituloBusca"
            class="form-control"
            placeholder="Digite o nome da vaga"
          />

          <button type="submit" class="btn btn-primary">Buscar</button>

          <button type="button" id="btnLimpar" class="btn btn-secondary">
            Limpar
          </button>
        </form>
      </section>

      <section class="mb-5">
        <h3 class="mb-3">Vagas disponíveis</h3>

        <div id="listaVagas" class="row g-3"></div>

        <p id="mensagemVagas" class="text-muted mt-3"></p>
      </section>

      <section id="cadastro" class="cadastro-section">
        <h3 class="mb-4">Cadastrar nova vaga</h3>

        <form id="formCadastro">
          <div class="mb-3">
            <label class="form-label">Título da vaga</label>

            <input type="text" id="titulo" class="form-control" required />
          </div>

          <div class="mb-3">
            <label class="form-label">Empresa</label>

            <input type="text" id="empresa" class="form-control" required />
          </div>

          <div class="mb-3">
            <label class="form-label">Descrição - informar contato</label>

            <textarea
              id="descricao"
              class="form-control"
              rows="4"
              required
            ></textarea>
          </div>

          <div class="mb-3">
            <label class="form-label">Localização</label>

            <input type="text" id="localizacao" class="form-control" required />
          </div>

          <div class="mb-3">
            <label class="form-label">Salário</label>

            <input
              type="number"
              id="salario"
              class="form-control"
              min="0"
              step="0.01"
            />
          </div>
          <button type="submit" class="btn btn-success">Cadastrar vaga</button>
        </form>

        <div id="mensagemCadastro" class="mt-3"></div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/script.js"></script>
  </body>
</html>
